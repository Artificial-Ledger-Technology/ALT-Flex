name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api-gateway/**'
      - 'packages/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/deploy-backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for API Gateway
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway

      - name: Build and push API Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api-gateway
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata for Hacks Worker
        id: meta-hacks
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hacks-worker

      - name: Build and push Hacks Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.hacks-worker
          push: true
          tags: ${{ steps.meta-hacks.outputs.tags }}
          labels: ${{ steps.meta-hacks.outputs.labels }}
          
      - name: Extract metadata for Skills Worker
        id: meta-skills
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/skills-worker

      - name: Build and push Skills Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.skills-worker
          push: true
          tags: ${{ steps.meta-skills.outputs.tags }}
          labels: ${{ steps.meta-skills.outputs.labels }}

  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Webhook
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
          else
            echo "DEPLOY_WEBHOOK_URL secret not found. Skipping webhook."
          fi

      - name: Verify Deployment Success
        run: |
          if [ -n "${{ secrets.DEPLOY_VERIFY_URL }}" ]; then
            echo "Waiting for service to restart..."
            sleep 15
            curl -f "${{ secrets.DEPLOY_VERIFY_URL }}/health" || exit 1
          else
            echo "DEPLOY_VERIFY_URL secret not found. Skipping verification."
          fi
