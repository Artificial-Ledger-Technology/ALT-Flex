name: CI

# Runs on every PR into main. There is no `develop` branch in this repository
# (P6-PROD-002 checked), so no trigger is declared for one — a trigger for a
# branch that does not exist is dead config.
#
# The push trigger is not decorative: GitHub Actions caches are branch-scoped.
# A PR branch can only read caches created on its base branch, so without a run
# on main the pnpm store and Next.js caches would never be warm and every PR
# would install and build from cold.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege — nothing here needs to write to the repository.
permissions:
  contents: read

# Pushing a fix cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  # Scoped to the files changed in the PR rather than the whole tree.
  #
  # Measured at 0e65aed on 2026-08-07: 65 ESLint errors across 15 files, all of
  # them production source — forensic-engine 40, api-gateway 11, web 10,
  # skills-engine 4 (2 of which are #195). Gating the whole tree would make this
  # pipeline red on its first run and train everyone to ignore it.
  #
  # Scoping to the diff is also better coverage than `pnpm run lint` would give:
  # the per-package scripts are `eslint src/`, which never sees test files at
  # all. The diff covers both. Tighten to a full-tree run once the 65 are gone
  # (#206 tracks the related test-file ratchet).
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history for the merge-base diff below

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-

      - name: Build Workspace (for type-aware linting)
        run: pnpm turbo run build

      - name: Lint changed TypeScript files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Push build — no PR diff to scope against. Skipping."
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE_REF"
          # `mapfile` reads from a process substitution, whose exit status
          # `set -e` does not observe — a failing git diff would leave `files`
          # empty and this step would pass having linted nothing. Resolve the
          # ref explicitly first so a bad base fails loudly instead.
          git rev-parse --verify "origin/$BASE_REF^{commit}" >/dev/null
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
            "origin/$BASE_REF...HEAD" -- '*.ts' '*.tsx' ':(exclude)*.d.ts')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No TypeScript files changed — nothing to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} changed file(s):"
          printf '  %s\n' "${files[@]}"
          pnpm exec eslint "${files[@]}"

  # ── Typecheck ───────────────────────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo run typecheck — every workspace package defines a typecheck
      # script, so nothing is silently skipped.
      - run: pnpm run typecheck

  # ── Test ────────────────────────────────────────────────────────────────────
  # turbo's `test` task dependsOn `build`, so this job compiles every package
  # (including `next build`) before running vitest. Build breakage therefore
  # fails here too.
  #
  # No Postgres or Redis service containers. The *.integration.test.ts files
  # guard on isPostgresAvailable() and self-skip, but the devsecops and pentest
  # families do not — they deliberately point at a dead port to assert the
  # connection-failure path, so a service container would not help them and in
  # some cases would break them. That those tests then race vitest's 5000ms
  # default timeout on runner hardware is #210. The absence of a real database
  # in CI is a genuine coverage gap, tracked separately as #183.
  #
  # `--continue` so one failing package reports alongside the others rather
  # than aborting the run — the same reason the three jobs are not chained.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - run: pnpm install --frozen-lockfile

      # POSTGRES_PASSWORD and JWT_SECRET are the only two variables in
      # GatewayEnvSchema with no default. Without them `validateEnv` calls
      # process.exit(1) at import time and four api-gateway suites never
      # collect (#205). These values are throwaway CI fixtures, not secrets —
      # JWT_SECRET only has to clear the schema's 32-character minimum, and
      # POSTGRES_PASSWORD is URL-safe because getDatabaseUrl() interpolates it
      # into a connection string.
      #
      # Setting them here is not sufficient on its own: turbo runs tasks in
      # strict env mode, so both are also declared on the `test` task in
      # turbo.json. Without that declaration turbo strips them and this block
      # is inert — which is exactly what happened before it was added.
      - run: pnpm turbo test --continue
        env:
          POSTGRES_PASSWORD: ci-test-password
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
