# ═══════════════════════════════════════════════════════════════════════════════
# AltFlex AEGIS v3.0 — Production Docker Compose
# Health checks · Restart policies · Resource limits · Log rotation
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#   make prod
# ═══════════════════════════════════════════════════════════════════════════════

name: aegis-prod

services:
  # ── PostgreSQL 16 — Primary Datastore ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres-prod
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis_prod}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_prod}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Redis 7 — Cache + BullMQ Job Queue Backend ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aegis-redis-prod
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── API Gateway — Fastify 5 BFF (Production) ────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api-gateway
      target: runner
    container_name: aegis-api-gateway-prod
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # Composed here rather than inherited from .env. The application reads
      # DATABASE_URL in preference to the POSTGRES_* parts, so a host-oriented
      # value in .env (localhost) would win over POSTGRES_HOST above and point
      # the service at itself. Compose `environment:` beats `env_file:`, so
      # building the URL from the same component variables the postgres service
      # uses keeps one source of truth inside the network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:4000/api/v1/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Web Frontend — Next.js 15 (Production) ──────────────────────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      target: runner
    container_name: aegis-web-prod
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      API_PROXY_URL: http://api-gateway:4000
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Hacks Worker — BullMQ ETL Pipeline (Production) ─────────────────────
  hacks-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.hacks-worker
      target: runner
    container_name: aegis-hacks-worker-prod
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # See api-gateway — .env's host-oriented DATABASE_URL must not win here.
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Skills Worker — BullMQ Indexer + Safety Scanner (Production) ────────
  skills-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.skills-worker
      target: runner
    container_name: aegis-skills-worker-prod
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # See api-gateway — .env's host-oriented DATABASE_URL must not win here.
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Forensic Engine — EVM Analysis Toolchain (Build-Only) ───────────────
  # Library package (src/index.ts) with no worker entrypoint, so it is built
  # and verified but never started. Excluded from `up` via the build profile.
  #   docker compose -f docker-compose.prod.yml --profile build build forensic-engine
  #   docker compose -f docker-compose.prod.yml --profile build run --rm forensic-engine forge --version
  forensic-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.forensic-engine
      target: runner
    image: aegis/forensic-engine:prod
    container_name: aegis-forensic-engine-prod
    profiles: ['build']

  # ── Prometheus — Metrics Scraping & Storage (Production) ────────────────
  # P6-PROD-005: Scrapes /metrics from backend services.
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus-prod
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Grafana — Observability Dashboards (Production) ─────────────────────
  # P6-PROD-006: Visualizes Prometheus metrics via pre-provisioned dashboards.
  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana-prod
    restart: unless-stopped
    ports:
      - '3001:3000'
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata_prod:/var/lib/grafana
    environment:
      # Production uses default auth (admin/admin), can be changed via env vars
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

  # ── Database Backup — Automated pg_dump Cron Service (Production) ───────
  # P6-PROD-009: Runs daily pg_dump backups at 02:00 UTC.
  # Uses the same postgres:16-alpine image which includes pg_dump.
  db-backup:
    image: postgres:16-alpine
    container_name: aegis-db-backup-prod
    restart: unless-stopped
    volumes:
      - ./infrastructure/scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - backupdata_prod:/backups
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis_prod}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    # Install crond entry and run as foreground process
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        chmod +x /scripts/db-backup.sh
        echo "0 2 * * * /scripts/db-backup.sh >> /var/log/aegis-backup.log 2>&1" | crontab -
        echo "[$(date -Iseconds)] 🗄️  AEGIS DB Backup cron service started (daily at 02:00 UTC)"
        crond -f -l 2
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - aegis-network

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  pgdata_prod:
    name: aegis-pgdata-prod
  redisdata_prod:
    name: aegis-redisdata-prod
  grafanadata_prod:
    name: aegis-grafanadata-prod
  backupdata_prod:
    name: aegis-backupdata-prod

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  aegis-network:
    name: aegis-prod-network
    driver: bridge
