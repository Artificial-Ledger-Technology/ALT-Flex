# ═══════════════════════════════════════════════════════════════════════════════
# AltFlex AEGIS v3.0 — Development Docker Compose
# Hot-reload enabled · Mounted volumes · Debug logging
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.dev.yml up --build -d
#   make dev
# ═══════════════════════════════════════════════════════════════════════════════

name: aegis-dev

services:
  # ── PostgreSQL 16 — Primary Datastore ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: aegis_dev
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis_dev']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aegis-network

  # ── Redis 7 — Cache + BullMQ Job Queue Backend ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aegis-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aegis-network

  # ── API Gateway — Fastify 5 BFF (Hot-Reload) ────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api-gateway
      target: deps
    container_name: aegis-api-gateway-dev
    command: pnpm --filter @aegis/api-gateway dev
    ports:
      - '4000:4000'
    volumes:
      # Hot-reload: Mount source directories for live changes
      - ./apps/api-gateway/src:/app/apps/api-gateway/src
      - ./apps/api-gateway/tsconfig.json:/app/apps/api-gateway/tsconfig.json
      - ./packages/core/src:/app/packages/core/src
      - ./packages/core/tsconfig.json:/app/packages/core/tsconfig.json
      - ./packages/hacks-engine/src:/app/packages/hacks-engine/src
      - ./packages/hacks-engine/tsconfig.json:/app/packages/hacks-engine/tsconfig.json
      - ./packages/skills-engine/src:/app/packages/skills-engine/src
      - ./packages/skills-engine/tsconfig.json:/app/packages/skills-engine/tsconfig.json
      - ./packages/forensic-engine/src:/app/packages/forensic-engine/src
      - ./packages/forensic-engine/tsconfig.json:/app/packages/forensic-engine/tsconfig.json
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # Overrides .env, where DATABASE_URL points at localhost for host-based
      # development. Compose `environment:` beats `env_file:`, and the
      # application prefers DATABASE_URL over the POSTGRES_* parts, so without
      # this the service would try to reach Postgres inside its own container.
      # Literal credentials, not ${POSTGRES_*}, because the postgres service
      # above hardcodes them too — the two must not drift apart.
      DATABASE_URL: postgresql://aegis:changeme@postgres:5432/aegis_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-network

  # ── Web Frontend — Next.js 15 (Hot-Reload) ──────────────────────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      target: deps
    container_name: aegis-web-dev
    command: pnpm --filter @aegis/web dev
    ports:
      - '3000:3000'
    volumes:
      # Hot-reload: Mount source + public + config for live changes
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts
      - ./packages/core/src:/app/packages/core/src
      - ./packages/core/tsconfig.json:/app/packages/core/tsconfig.json
    env_file: .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_PROXY_URL: http://api-gateway:4000
    depends_on:
      - api-gateway
    networks:
      - aegis-network

  # ── Hacks Worker — BullMQ ETL Pipeline (Hot-Reload) ─────────────────────
  hacks-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.hacks-worker
      target: deps
    container_name: aegis-hacks-worker-dev
    command: pnpm --filter @aegis/hacks-engine dev
    volumes:
      # Hot-reload: Mount source for live changes
      - ./packages/hacks-engine/src:/app/packages/hacks-engine/src
      - ./packages/hacks-engine/tsconfig.json:/app/packages/hacks-engine/tsconfig.json
      - ./packages/core/src:/app/packages/core/src
      - ./packages/core/tsconfig.json:/app/packages/core/tsconfig.json
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://aegis:changeme@postgres:5432/aegis_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-network

  # ── Skills Worker — BullMQ Indexer + Safety Scanner (Hot-Reload) ────────
  skills-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.skills-worker
      target: deps
    container_name: aegis-skills-worker-dev
    command: pnpm --filter @aegis/skills-engine dev
    volumes:
      # Hot-reload: Mount source for live changes
      - ./packages/skills-engine/src:/app/packages/skills-engine/src
      - ./packages/skills-engine/tsconfig.json:/app/packages/skills-engine/tsconfig.json
      - ./packages/core/src:/app/packages/core/src
      - ./packages/core/tsconfig.json:/app/packages/core/tsconfig.json
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://aegis:changeme@postgres:5432/aegis_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-network

  # ── Forensic Engine — EVM Analysis Toolchain (Build-Only) ───────────────
  # Library package (src/index.ts) with no worker entrypoint, so it is built
  # and verified but never started. Excluded from `up` via the build profile.
  #   docker compose -f docker-compose.dev.yml --profile build build forensic-engine
  #   docker compose -f docker-compose.dev.yml --profile build run --rm forensic-engine forge --version
  forensic-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.forensic-engine
      target: runner
    image: aegis/forensic-engine:dev
    container_name: aegis-forensic-engine-dev
    profiles: ['build']

  # ── Prometheus — Metrics Scraping & Storage ─────────────────────────────
  # P6-PROD-005: Scrapes /metrics from backend services.
  # Access the Prometheus UI at http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus-dev
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway
    networks:
      - aegis-network

  # ── Grafana — Observability Dashboards ───────────────────────────────────
  # P6-PROD-006: Visualizes Prometheus metrics via pre-provisioned dashboards.
  # Access the Grafana UI at http://localhost:3001
  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana-dev
    ports:
      - '3001:3000'
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata_dev:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    depends_on:
      - prometheus
    networks:
      - aegis-network

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  pgdata_dev:
    name: aegis-pgdata-dev
  redisdata_dev:
    name: aegis-redisdata-dev
  grafanadata_dev:
    name: aegis-grafanadata-dev

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  aegis-network:
    name: aegis-dev-network
    driver: bridge
